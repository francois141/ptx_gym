[build-system]
requires = [
    "setuptools>=40.8.0",
    "cmake>=3.20,<4.0",
    "ninja>=1.11.1",
    "pybind11>=2.13.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "ptx_gym"
dynamic = ["version", "dependencies"]
requires-python = ">=3.10,<3.15"

[tool.setuptools.dynamic]
dependencies = {file = ["triton_src/requirements.txt"]}

[tool.uv]
# This distribution ships the patched triton package, so keep torch from
# installing stock Triton over it.
override-dependencies = ["triton; sys_platform == 'never'"]
